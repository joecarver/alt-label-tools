name: Deploy Supabase Functions

on:
  push:
    paths:
      - 'supabase/**'
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
        # Remove any existing files
          rm -f supabase_linux_amd64.tar.gz
          rm -rf supabase
          
          # Download and install
          wget -q https://github.com/supabase/cli/releases/download/v1.142.0/supabase_linux_amd64.tar.gz
          tar xzf supabase_linux_amd64.tar.gz
          sudo mv supabase /usr/local/bin/
          rm supabase_linux_amd64.tar.gz
          
          # Verify installation
          supabase --version
        shell: bash

      - name: Deploy Supabase Functions
        run: |
          chmod +x deploy-supabase-functions.sh
          ./deploy-supabase-functions.sh
        env:
          # Use a Supabase access token from https://supabase.com/dashboard/account/tokens
          # This is different from the service_role key and is specifically for CLI operations
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash 