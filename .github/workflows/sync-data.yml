# .github/workflows/sync-data.yml
name: Sync Data

on:
  schedule:
    - cron: '* * * * *'  # Every minute
  workflow_dispatch:  # Allow manual triggers

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Clients
        id: sync-clients
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/sync-clients" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json")
          status_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "status_code=$status_code" >> $GITHUB_OUTPUT
          echo "body=$body" >> $GITHUB_OUTPUT
          
          if [ "$status_code" -ne 200 ]; then
            echo "::error::Failed to sync clients: $body"
            exit 1
          fi

      - name: Sync Releases
        id: sync-releases
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/sync-releases" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json")
          status_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "status_code=$status_code" >> $GITHUB_OUTPUT
          echo "body=$body" >> $GITHUB_OUTPUT
          
          if [ "$status_code" -ne 200 ]; then
            echo "::error::Failed to sync releases: $body"
            exit 1
          fi

      - name: Sync Tasks
        id: sync-tasks
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/sync-tasks" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json")
          status_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "status_code=$status_code" >> $GITHUB_OUTPUT
          echo "body=$body" >> $GITHUB_OUTPUT
          
          if [ "$status_code" -ne 200 ]; then
            echo "::error::Failed to sync tasks: $body"
            exit 1
          fi

      - name: Sync Task Statuses
        id: sync-task-statuses
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/sync-task-statuses" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json")
          status_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "status_code=$status_code" >> $GITHUB_OUTPUT
          echo "body=$body" >> $GITHUB_OUTPUT
          
          if [ "$status_code" -ne 200 ]; then
            echo "::error::Failed to sync task statuses: $body"
            exit 1
          fi

      - name: Check sync health
        id: check-health
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/monitor-sync-health" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json")
          status_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "status_code=$status_code" >> $GITHUB_OUTPUT
          echo "body=$body" >> $GITHUB_OUTPUT
          
          # Check if there are any unhealthy syncs
          unhealthy_count=$(echo "$body" | jq '.data.unhealthySyncs | length')
          if [ "$unhealthy_count" -gt 0 ]; then
            echo "::error::Found $unhealthy_count unhealthy syncs"
            echo "unhealthy_syncs=$body" >> $GITHUB_OUTPUT
            exit 1
          fi